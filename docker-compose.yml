services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # In-memory state with periodic JSON snapshots into a named volume.
      # Remove this variable for a fully ephemeral exchange.
      EXCHANGEKIT_SNAPSHOT: /data/snapshot.json
    volumes:
      - exchangekit-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  exchangekit-data:
